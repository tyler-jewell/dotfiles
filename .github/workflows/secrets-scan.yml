# gitleaks over the PR's commits (full history on push). Calls the shared reusable workflow.
name: secrets-scan
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  secrets-scan:
    uses: tyler-jewell/shared-config/.github/workflows/secrets-scan.yml@v1
    permissions:
      contents: read
